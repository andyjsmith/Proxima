name: Build

# Deliberately not on push or pull_request: a standalone build of the whole
# GTK, SPICE and GStreamer stack takes long enough, on three runners, that
# nothing downstream of a commit should wait on it. Start one by hand from
# Actions -> Build -> "Run workflow" (the branch picker there chooses what
# gets built), or push a `build-please` label onto a pull request to have that
# PR's head built.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  # Called by release.yml, which packages what these jobs produce.
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All three platforms are built by PyInstaller, from packaging/proxima.spec.
# The reasons are in that file's header and in DEVELOPMENT.md; the short
# version is that PyInstaller ships runtime hooks for the whole GNOME stack,
# follows the shared libraries the GStreamer plugins pull in, and needs no
# compiler on any of the three.
jobs:
  linux:
    name: Linux
    # `labeled` fires for every label, so the one that means "build this" has
    # to be checked here. Dispatched and release-called runs have no label and
    # fall through the first clause.
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-please'
    # Deliberately the oldest supported runner: the bundle carries this
    # glibc's dependants and will not start on anything older.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the GTK stack
        run: |
          sudo apt-get update
          # PyGObject and spice-gtk come from apt: PyInstaller freezes the
          # interpreter that can already import them. GStreamer is what
          # decodes SPICE video. librsvg2-common is the gdk-pixbuf SVG loader,
          # which is what draws Adwaita's symbolic icons -- without it
          # installed the bundle gets a loader directory with no way to read
          # an SVG, and the toolbar comes up blank.
          #
          # python3-dev is not for a compiler -- nothing is compiled here. It
          # is what brings libpython3.x.so, which PyInstaller has to put in
          # the bundle; the interpreter on its own links it statically and
          # ships no copy to carry. GIRepository-2.0.typelib, which
          # PyInstaller's gi hooks import to find every other namespace's
          # typelib, comes with python3-gi's own dependencies on this
          # release -- it is inside gir1.2-glib-2.0 rather than a package of
          # its own until 24.04.
          sudo apt-get install -y --no-install-recommends \
            binutils \
            python3-dev \
            python3-gi \
            python3-gi-cairo \
            python3-pip \
            gir1.2-gtk-3.0 \
            gir1.2-spiceclientgtk-3.0 \
            gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa \
            adwaita-icon-theme \
            hicolor-icon-theme \
            librsvg2-common \
            xvfb

      - name: Check the stack
        # The interpreter first: this runner is pinned for its glibc, and the
        # python that comes with it is older than the one a checkout is
        # developed against. Anything the bundle imports has to exist here.
        run: |
          python3 --version
          python3 -c 'import gi; gi.require_version("Gtk","3.0"); from gi.repository import Gtk; print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())'
          python3 -c 'import proxima; print("version", proxima.__version__)'

      - name: Install PyInstaller
        # Into the system interpreter, deliberately: a venv without
        # --system-site-packages could not see python3-gi, and PyInstaller
        # freezes the interpreter it is run by.
        run: python3 -m pip install --upgrade pyinstaller

      - name: Build the bundle
        run: |
          python3 -m PyInstaller packaging/proxima.spec --noconfirm \
            --distpath build/dist --workpath build/pyinstaller

      - name: Collect the licenses
        # The bundle redistributes GTK, spice-gtk, GStreamer and their
        # dependencies, all of which come with terms that have to travel with
        # them. Every library in the bundle is traced back to the package it
        # came from, and that package's copyright file is carried along.
        #
        # Beside the executable rather than under _internal: the deb and the
        # rpm point at /opt/proxima/licenses.
        run: |
          set -euo pipefail
          libdir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          out=build/dist/proxima/licenses
          mkdir -p "$out"
          # `|| true` twice, deliberately: dpkg -S exits non-zero for any
          # library that came from PyInstaller or from a wheel rather than
          # from a package, and under `set -o pipefail` that one failure is
          # the exit status of the whole substitution.
          packages=$(
            find build/dist/proxima -name '*.so*' -printf '%f\n' \
            | while read -r name; do
                dpkg -S "$libdir/$name" 2>/dev/null | cut -d: -f1 || true
              done | tr ',' '\n' | sed '/^$/d' | sort -u || true
          )
          for package in $packages; do
            file="/usr/share/doc/$package/copyright"
            if [ -f "$file" ]; then
              cp "$file" "$out/$package.txt"
            fi
          done
          printf '%s\n' "$packages" > "$out/PACKAGES.txt"
          cp packaging/NOTICE.md build/dist/proxima/NOTICE.md
          echo "collected $(ls "$out" | wc -l) license file(s)"

      - name: Smoke test the bundle
        run: |
          set -euo pipefail
          xvfb-run -a ./build/dist/proxima/proxima --diagnose | tee diagnose.txt
          grep -q "SPICE widget available: True" diagnose.txt \
            || { echo "::error::the build has no working SPICE widget"; exit 1; }
          # The one that matters. A typelib with no library behind it still
          # imports, so the line above stays True for a bundle that cannot
          # open a single console -- this one actually builds a session.
          grep -q "SPICE session usable: True" diagnose.txt \
            || { echo "::error::SPICE types cannot be created in this bundle"; exit 1; }
          # A bundle that cannot read its own pyproject.toml still starts, and
          # then calls itself 0.0.0+unknown in the About box and in every bug
          # report that follows.
          ! grep -q "0\.0\.0+unknown" diagnose.txt \
            || { echo "::error::the bundle cannot read its own version"; exit 1; }
          ! grep -q "\[MISSING\]" diagnose.txt \
            || { echo "::error::the bundle is missing GTK runtime data"; exit 1; }
          grep -Eq "H\.264 +[^ ]+ +available" diagnose.txt \
            || echo "::warning::no H.264 decoder in the bundle; SPICE video will fall back"

      - name: Pack the bundle
        # tar, not the artifact's own zip: the executable bit has to survive.
        run: tar -C build/dist -czf proxima-linux-x86_64-dist.tar.gz proxima

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: proxima-linux-x86_64-dist.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-please'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # PyGObject and spice-gtk are pacman packages here; a python.org
          # interpreter cannot load them, which is why the whole Windows
          # build lives inside MSYS2. See the note at the top of proxima.py.
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-spice-gtk
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-pyinstaller

      - name: Check the stack
        shell: msys2 {0}
        run: |
          python --version
          python -m PyInstaller --version
          python -c "import gi; gi.require_version('Gtk','3.0'); from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())"
          python -c "from proxima.console import SPICE_AVAILABLE; print('SPICE available:', SPICE_AVAILABLE)"

      - name: Build the bundle
        shell: msys2 {0}
        run: |
          python -m PyInstaller packaging/proxima.spec --noconfirm \
            --distpath build/dist --workpath build/pyinstaller

      - name: Collect the licenses
        # MSYS2 keeps every package's licence under share/licenses, and the
        # bundle redistributes those packages. Beside the executable rather
        # than under _internal, to match Linux and because the installer's
        # licence page points there.
        shell: msys2 {0}
        run: |
          cp -a "$MSYSTEM_PREFIX/share/licenses" build/dist/proxima/licenses
          cp packaging/NOTICE.md build/dist/proxima/NOTICE.md
          echo "collected $(ls build/dist/proxima/licenses | wc -l) license directory(ies)"

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          # A scrubbed PATH, so a bundle that only works because MSYS2 is on
          # this machine fails here rather than on a user's computer.
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $out = & .\build\dist\proxima\proxima.exe --diagnose 2>&1 | Out-String
          $out
          if ($out -cnotmatch "SPICE widget available: True") {
            Write-Output "::error::the build has no working SPICE widget"; exit 1
          }
          # The one that matters. A typelib with no library behind it still
          # imports, so the check above stays True for a bundle that cannot
          # open a single console -- this one actually builds a session.
          if ($out -cnotmatch "SPICE session usable: True") {
            Write-Output "::error::SPICE types cannot be created in this bundle"; exit 1
          }
          if ($out -cmatch "0\.0\.0\+unknown") {
            Write-Output "::error::the bundle cannot read its own version"; exit 1
          }
          # -cmatch, not -match: bundle.report() marks only genuinely absent
          # required data as "MISSING" in capitals, and PowerShell's plain
          # -match is case-insensitive -- so it would also fire on any
          # lower-case "missing" that happened to appear in the report.
          # Fontconfig is one of the required ones here: MSYS2 keeps etc/ one
          # level above the DLLs, where PyInstaller does not look for it, so
          # the spec carries it by hand and this is what proves it worked.
          if ($out -cmatch "\[MISSING\]") {
            Write-Output "::error::the bundle is missing GTK runtime data"; exit 1
          }
          if ($out -cnotmatch "H\.264\s+\S+\s+available") {
            Write-Output "::warning::no H.264 decoder in the bundle; SPICE video will fall back"
          }

      - name: Pack the bundle
        shell: pwsh
        run: tar -C build/dist -czf proxima-windows-x86_64-dist.tar.gz proxima

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: proxima-windows-x86_64-dist.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-please'
    # arm64. An Intel bundle has to be built on an Intel Mac -- Homebrew
    # ships no cross-compiled bottles and the GTK stack here comes entirely
    # from bottles, so there is nothing to point a --target-arch at.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the GTK stack
        # librsvg is the gdk-pixbuf SVG loader, which is what draws Adwaita's
        # symbolic icons; adwaita-icon-theme does not pull it in on macOS the
        # way apt's dependency chain does on Linux, and without either the
        # toolbar comes up blank. spice-gtk brings the whole of GStreamer
        # with it, codecs included, so nothing else is needed for video.
        run: |
          brew install --quiet \
            pygobject3 \
            gtk+3 \
            spice-gtk \
            adwaita-icon-theme \
            hicolor-icon-theme \
            librsvg

      - name: Find the interpreter PyGObject was built for
        # Homebrew builds pygobject3 against its own Python, and a
        # separately installed PyGObject cannot find the typelibs -- the same
        # constraint as apt on Linux and pacman on Windows. Which Python that
        # is changes as Homebrew moves on, so it is read out of the keg
        # rather than pinned here; the check below fails loudly if the answer
        # is wrong.
        run: |
          set -euo pipefail
          version=$(brew list pygobject3 \
            | sed -n 's|.*/lib/\(python3\.[0-9]*\)/site-packages/.*|\1|p' \
            | sort -V | tail -1)
          echo "PYTHON=$(brew --prefix "python@${version#python}")/bin/$version" >> "$GITHUB_ENV"

      - name: Check the stack
        run: |
          set -euo pipefail
          "$PYTHON" --version
          "$PYTHON" -c 'import gi; gi.require_version("Gtk","3.0"); from gi.repository import Gtk; print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())'
          "$PYTHON" -c 'import proxima; print("version", proxima.__version__)'

      - name: Install PyInstaller
        # --break-system-packages: this is Homebrew's Python and it is
        # externally managed, but it has to be the one PyInstaller runs
        # under -- it freezes the interpreter it is executed by, and only
        # this one can import gi.
        run: |
          "$PYTHON" -m pip install --break-system-packages --quiet pyinstaller

      - name: Build the app bundle
        run: |
          "$PYTHON" -m PyInstaller packaging/proxima.spec --noconfirm \
            --distpath build/dist --workpath build/pyinstaller

      - name: Add the third-party notice
        # No per-package licence collection here: Homebrew has no equivalent
        # of dpkg -S or MSYS2's share/licenses tree, so what the bundle
        # carries is named in NOTICE.md instead.
        run: |
          set -euo pipefail
          mkdir -p build/dist/Proxima.app/Contents/Resources
          cp packaging/NOTICE.md build/dist/Proxima.app/Contents/Resources/

      - name: Smoke test the bundle
        # The same checks as the Linux job, for the same reasons; see there.
        run: |
          set -euo pipefail
          ./build/dist/Proxima.app/Contents/MacOS/proxima --diagnose | tee diagnose.txt
          grep -q "SPICE widget available: True" diagnose.txt \
            || { echo "::error::the build has no working SPICE widget"; exit 1; }
          grep -q "SPICE session usable: True" diagnose.txt \
            || { echo "::error::SPICE types cannot be created in this bundle"; exit 1; }
          ! grep -q "0\.0\.0+unknown" diagnose.txt \
            || { echo "::error::the bundle cannot read its own version"; exit 1; }
          ! grep -q "\[MISSING\]" diagnose.txt \
            || { echo "::error::the bundle is missing GTK runtime data"; exit 1; }
          # Not a warning here, unlike Linux: Homebrew has no openh264 plugin
          # and gst-libav is deliberately not bundled, so vtdec out of
          # applemedia is the only H.264 decoder there is. If it is gone, it
          # went silently.
          grep -Eq "H\.264 +[^ ]+ +available" diagnose.txt \
            || { echo "::error::no H.264 decoder in the bundle"; exit 1; }

      - name: Pack the bundle
        # tar, not the artifact's own zip: a .app is full of symlinks and
        # executable bits, and the zip an artifact upload makes keeps
        # neither -- the result downloads as an app macOS refuses to open.
        run: tar -C build/dist -czf proxima-macos-arm64-app.tar.gz Proxima.app

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: proxima-macos-arm64-app.tar.gz
          if-no-files-found: error
          retention-days: 7
