name: Test docs deployment

# Proves the site still builds, without publishing anything. A broken link is
# a failed build here, because onBrokenLinks is 'throw'.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/test-deploy-docs.yml'

jobs:
  test-deploy:
    name: Test the build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test build website
        run: npm run build
